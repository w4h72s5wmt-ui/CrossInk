# Personal X4 Pro build overrides.
# Keep the base firmware configuration intact while generating only the two
# UI languages used by this build.
[env:x4-pro]
# Point 3 experiment: keep error logging, but compile out informational logs.
# Preserve the base unflags while removing the release LOG_LEVEL=1 define;
# Logging.h then uses its default LOG_LEVEL=0 (ERR only).
build_unflags =
  ${base.build_unflags}
  -DLOG_LEVEL=1
extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_web.py
  pre:scripts/gen_i18n_fr_en.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_websockets.py
  post:scripts/check_firmware_size.py
  post:scripts/check_app_touch_gate.py
  post:scripts/rename_firmware.py
