name: One-shot Notes vault reset

on:
  push:
    branches: [x4-pro-notes]
    paths:
      - .github/workflows/oneshot-notes-vault-reset.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout x4-pro-notes
        uses: actions/checkout@v6
        with:
          ref: x4-pro-notes
          submodules: recursive
          fetch-depth: 0

      - name: Apply Notes vault reset patch
        run: python3 tools/apply_notes_vault_reset.py

      - name: Validate patch
        run: git diff --check

      - name: Commit feature source
        run: |
          set -euo pipefail
          git config user.name "w4h72s5wmt-ui"
          git config user.email "w4h72s5wmt@privaterelay.appleid.com"
          git rm .github/workflows/oneshot-notes-vault-reset.yml tools/apply_notes_vault_reset.py
          git add src/activities/home/NotesActivity.cpp
          git commit -m "feat: offer vault reset after three failed codes"
          git push origin HEAD:x4-pro-notes

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build X4 Pro firmware
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro-notes-vault-reset.log

      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-notes-vault-reset-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error
