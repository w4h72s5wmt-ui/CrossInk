name: CI (X4 Pro test build)

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-x4-pro-${{ hashFiles('platformio.ini', 'platformio.local.example.ini', 'platformio.local.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build X4 Pro firmware (verbose LTO diagnostic)
        run: |
          set -euo pipefail
          pio run -v -e x4-pro | tee pio-x4-pro.log

      - name: Extract compiler optimization flags
        run: |
          set -euo pipefail
          {
            echo "## X4 Pro compiler/linker diagnostic"
            echo "### LTO-related flags"
            grep -oE -- '-f(no-)?lto(=[^[:space:]]+)?' pio-x4-pro.log | sort -u || true
            echo "### Optimization flags"
            grep -oE -- '-O([0-3sg]|fast)' pio-x4-pro.log | sort -u || true
            echo "### Firmware stats"
            grep -E "RAM:\s|Flash:\s" pio-x4-pro.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload X4 Pro firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error
