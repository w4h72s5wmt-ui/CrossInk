name: Missile Command Clean Diagnostic Base X4 Pro

on:
  push:
    branches: [x4-pro-missile-304]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x4-pro-missile-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Apply clean diagnostic-base source
        run: python tools/missile_diag_clean.py

      - name: Verify diagnostic removal and tactile return
        run: |
          set -euo pipefail
          ! grep -R "BENCHMARK_PATH\|CONTROLLER_DIAG_PATH\|writeControllerDiagnostic\|openBenchmarkLog\|recordBenchmarkSample" src/activities/home/MissileCommandActivity.*
          grep -q "pointInRect(gameOverActionRect(renderer), tx, ty)" src/activities/home/MissileCommandActivity.cpp
          grep -q "slot->speed = 140;" src/activities/home/MissileCommandActivity.cpp
          grep -q "EXPLOSION_PHASE_TICKS = 1" src/activities/home/MissileCommandActivity.cpp

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-missile-clean-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build X4 Pro Missile firmware
        run: |
          set -euo pipefail
          pio run -e x4-pro-missile | tee pio-x4-pro-missile-clean.log

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-missile-clean-${{ github.run_number }}
          path: .pio/build/x4-pro-missile/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-missile-clean-${{ github.run_number }}-log
          path: pio-x4-pro-missile-clean.log
          if-no-files-found: ignore

      - name: Commit validated clean source
        if: success()
        run: |
          rm tools/missile_diag_clean.py
          rm .github/workflows/missile-clean-diag-base.yml
          git config user.name "CrossInk Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/activities/home/MissileCommandActivity.cpp src/activities/home/MissileCommandActivity.h tools/missile_diag_clean.py .github/workflows/missile-clean-diag-base.yml
          git commit -m "fix(missile): clean diag build and enable game-over touch return"
          git push
