name: One-shot Notes vault implementation

on:
  push:
    branches: [notes-lock-vault-34142490266]
    paths:
      - .github/workflows/oneshot-notes-vault.yml
      - .github/scripts/notes_vault_patch.py

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: notes-lock-vault-34142490266
          submodules: recursive
          fetch-depth: 0

      - name: Apply Notes vault patch
        run: python3 .github/scripts/notes_vault_patch.py

      - name: Validate patch
        run: git diff --check

      - name: Commit feature sources
        run: |
          git config user.name "w4h72s5wmt-ui"
          git config user.email "w4h72s5wmt@privaterelay.appleid.com"
          git rm .github/workflows/oneshot-notes-vault.yml .github/scripts/notes_vault_patch.py
          git add src/activities/home/NotesActivity.cpp src/activities/home/NotesActivity.h src/activities/util/KeyboardEntryActivity.cpp src/activities/util/KeyboardEntryActivity.h
          git commit -m "feat: add locked Notes vault"
          git push origin HEAD:notes-lock-vault-34142490266

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build X4 Pro firmware
        run: pio run -e x4-pro | tee pio-x4-pro-notes-vault.log

      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-notes-vault-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-notes-vault-${{ github.run_number }}-log
          path: pio-x4-pro-notes-vault.log
          if-no-files-found: ignore
