name: Missile Stage B Legacy Gameplay X4 Pro

on:
  push:
    branches: [x4-pro-missile-uc8279-window]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-missile-stageb-legacy-pio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Apply UC8279 Stage B window patch
        run: python scripts/uc8279_window_benchmark_patch.py

      - name: Preserve stable Missile gameplay timing
        run: python scripts/missile_stageb_gameplay_fix.py

      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro firmware
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro-stageb-legacy.log

      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v7
        with:
          name: missile-stageb-legacy-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: missile-stageb-legacy-${{ github.run_number }}-log
          path: pio-x4-pro-stageb-legacy.log
          if-no-files-found: ignore
