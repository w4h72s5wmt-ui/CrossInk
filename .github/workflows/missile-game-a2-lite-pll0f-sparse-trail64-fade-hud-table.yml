name: Missile GAME-A2 Lite PLL0F Sparse Trail64 Fade Header HUD OPT12 4P Cluster1 PROFILE1 EntryHalf Explosion2 BaseMode2 X4 Pro

on:
  push:
    branches:
      - x4-pro-missile-profile1-entryhalf-explosion2-basemode

jobs:
  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Run actions/setup-python@v6
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: uv tool install platformio

      - name: Apply Stage B window transfer patch
        run: python scripts/uc8279_window_benchmark_patch.py

      - name: Preserve stable Missile gameplay timing
        run: python scripts/missile_stageb_gameplay_fix.py

      - name: Apply Fast40 Hybrid-A waveform and benchmark
        run: python scripts/uc8279_fast40_hybrid_a.py

      - name: Apply GAME-A2 Lite transition-only waveform and wave scrub
        run: python scripts/uc8279_game_a2_lite_wave_scrub.py

      - name: Apply temporary dirty-window PLL 0x0F
        run: python scripts/uc8279_game_a2_lite_pll0f.py

      - name: Apply sparse-DTM tiled upload and menu scrub
        run: python scripts/uc8279_game_a2_lite_sparse_dtm.py

      - name: Apply pinned-SDK sparse compile fix
        run: python scripts/uc8279_sparse_compile_fix.py

      - name: Apply Trail64 fade clipping
        run: python scripts/missile_sparse_trail64_fade_clean.py

      - name: Restore normal app exit and scrub only on game-menu return
        run: python scripts/missile_menu_scrub_exit_normal_fix.py

      - name: Apply fixed-cell HUD table
        run: python scripts/missile_sparse_trail64_hud_table.py

      - name: Move wave/cities to header and keep Score/Record below
        run: python scripts/missile_header_score_record_hud.py

      - name: Clean header alignment and update cities per wave only
        run: python scripts/missile_header_hud_clean_wave_city.py

      - name: Reserve visible header counter lane
        run: python scripts/missile_header_hud_reserved_meta_fix.py

      - name: Refresh displayed Record only per wave
        run: python scripts/missile_record_refresh_per_wave.py

      - name: Align Vague/Villes to title baseline
        run: python scripts/missile_header_baseline_align.py

      - name: Apply OPT12 sparse DTM1 and spatial Bayer
        run: python scripts/missile_opt12_sparse_dtm1_bayer.py

      - name: Lock header counters to exact title baseline
        run: python scripts/missile_header_true_baseline.py

      - name: Apply A2-Lite 4P and single title-line header
        run: python scripts/missile_opt12_4p_titleline.py

      - name: Apply compact French title and one-frame dirty-cluster deferral
        run: python scripts/missile_4p_titlefr_cluster1.py

      - name: Apply PROFILE1 instrumentation
        run: python scripts/missile_cluster1_profile1.py

      - name: Apply clean HALF gameplay-entry baseline
        run: python scripts/missile_profile1_entry_half.py

      - name: Apply smoother faster Explosion2 gameplay polish
        run: python scripts/missile_explosion2_polish.py

      - name: Apply three-base gameplay mode
        run: python scripts/missile_base_mode.py

      - name: Apply BaseMode2 menu/save/explosion cleanup
        run: python scripts/missile_basemode_cleanup.py

      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro firmware
        run: set -o pipefail; pio run -e x4-pro | tee build-x4-pro.log

      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v4
        with:
          name: missile-profile1-entryhalf-explosion2-basemode2-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware.bin
          if-no-files-found: error

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: missile-profile1-entryhalf-explosion2-basemode2-${{ github.run_number }}-log
          path: build-x4-pro.log
          if-no-files-found: error
