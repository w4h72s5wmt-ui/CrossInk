name: Missile Command on Build 304

on:
  push:
    branches: [x4-pro-missile-304]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x4-pro-missile-304:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Integrate Missile Command directly into build 304 sources
        run: python tools/integrate_missile_304.py

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-missile-304-pio-py3.14-core6.1.19-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Test RSS cache with ASan and UBSan
        run: sh tests/rss/run.sh

      - name: Clean X4 Pro Missile build output
        run: pio run -e x4-pro-missile -t clean

      - name: Build X4 Pro Missile firmware
        run: |
          set -euo pipefail
          pio run -e x4-pro-missile | tee pio-x4-pro-missile-304.log

      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-missile-304-${{ github.run_number }}
          path: .pio/build/x4-pro-missile/firmware-x4-pro-missile.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-missile-304-${{ github.run_number }}-log
          path: pio-x4-pro-missile-304.log
          if-no-files-found: ignore

      - name: Commit validated direct sources and remove integration helper
        if: success()
        run: |
          rm tools/integrate_missile_304.py
          git config user.name "CrossInk Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/activities/home/MissileCommandActivity.cpp src/activities/home/MissileCommandActivity.h src/activities/home/HomeActivity.cpp src/activities/home/HomeActivity.h platformio.ini tools/integrate_missile_304.py
          git commit -m "feat(missile): integrate responsive game on build 304"
          git push
