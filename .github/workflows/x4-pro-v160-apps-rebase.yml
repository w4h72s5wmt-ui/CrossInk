name: X4 Pro v1.6 Apps Rebase

on:
  push:
    branches:
      - x4-pro-apps-v160-rebase
  workflow_dispatch:

jobs:
  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: uv tool install platformio

      - name: Clean X4 Pro
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro
        run: set -o pipefail; pio run -e x4-pro | tee build-x4-pro.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: x4-pro-v160-apps-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware.bin
          if-no-files-found: error

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: x4-pro-v160-apps-${{ github.run_number }}-log
          path: build-x4-pro.log
          if-no-files-found: error
