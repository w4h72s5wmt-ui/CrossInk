name: X4 Pro v1.6 Dual-Bit Fast Zoom

on:
  push:
    branches:
      - feat/v160-xtc-dualbit-fast-zoom
  workflow_dispatch:

jobs:
  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-v160-build99-${{ hashFiles('platformio.ini', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pio-v160-
            ${{ runner.os }}-pio-
      - name: Install PlatformIO Core
        run: uv tool install platformio
      - name: Apply minimal X4 Pro local-refresh SDK overlay
        run: cp -a consolidated/freeink-sdk/. freeink-sdk/
      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean
      - name: Build X4 Pro firmware
        run: set -o pipefail; pio run -e x4-pro | tee build-x4-pro.log
      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v4
        with:
          name: crossink-v160-dualbit-zoom-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware.bin
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossink-v160-dualbit-zoom-${{ github.run_number }}-log
          path: build-x4-pro.log
          if-no-files-found: ignore
