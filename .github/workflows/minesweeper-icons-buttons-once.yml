name: One-shot home icons and Minesweeper buttons

on:
  push:
    branches: [x4-pro-notes]
    paths:
      - .github/workflows/minesweeper-icons-buttons-once.yml

permissions:
  contents: write

jobs:
  apply-ui-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: x4-pro-notes

      - name: Apply semantic icons and Minesweeper action buttons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Add semantic icon ids.
          path = Path('src/components/themes/BaseTheme.h')
          text = path.read_text()
          old = '''  Wifi,\n  Hotspot,\n  Chart\n};'''
          new = '''  Wifi,\n  Hotspot,\n  Chart,\n  NoteIcon,\n  MinesweeperIcon\n};'''
          if text.count(old) != 1:
              raise SystemExit(f'BaseTheme icon enum marker mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          # 2) Assign the new semantic icons on Home and invalidate cached carousel frames.
          path = Path('src/activities/home/HomeActivity.cpp')
          text = path.read_text()
          if text.count('constexpr uint16_t CAROUSEL_CACHE_VERSION = 5;') != 1:
              raise SystemExit('Unexpected carousel cache version')
          text = text.replace('constexpr uint16_t CAROUSEL_CACHE_VERSION = 5;',
                              'constexpr uint16_t CAROUSEL_CACHE_VERSION = 6;', 1)
          notes_old = 'items.push({tr(STR_NOTES), BookmarkIcon, HomeMenuAction::Notes});'
          mine_old = 'items.push({"Demineur", Chart, HomeMenuAction::Minesweeper});'
          if text.count(notes_old) != 2 or text.count(mine_old) != 2:
              raise SystemExit(f'Unexpected Home icon mappings: notes={text.count(notes_old)} mines={text.count(mine_old)}')
          text = text.replace(notes_old, 'items.push({tr(STR_NOTES), NoteIcon, HomeMenuAction::Notes});')
          text = text.replace(mine_old, 'items.push({"Demineur", MinesweeperIcon, HomeMenuAction::Minesweeper});')
          path.write_text(text)

          # 3) Draw dedicated Notes and Minesweeper icons in Lyra-derived icon menus.
          path = Path('src/components/themes/lyra/LyraTheme.cpp')
          text = path.read_text()
          marker = '''\n}  // namespace\n\nconst freeink::Icon* LyraTheme::iconForName'''
          if text.count(marker) != 1:
              raise SystemExit(f'Lyra namespace marker mismatch: {text.count(marker)}')
          helpers = r'''

void drawNoteMainMenuIcon(const GfxRenderer& renderer, const int x, const int y) {
  // Compact monochrome notepad: page outline, binding edge and writing lines.
  renderer.drawRect(x + 5, y + 3, 22, 27, 2, true);
  renderer.drawLine(x + 9, y + 4, x + 9, y + 28, 1, true);
  renderer.drawLine(x + 12, y + 10, x + 23, y + 10, 2, true);
  renderer.drawLine(x + 12, y + 16, x + 23, y + 16, 2, true);
  renderer.drawLine(x + 12, y + 22, x + 20, y + 22, 2, true);
}

void drawMinesweeperMainMenuIcon(const GfxRenderer& renderer, const int x, const int y) {
  // A mine inside a Minesweeper cell, matching the app's square e-ink vocabulary.
  constexpr int cx = 16;
  constexpr int cy = 16;
  renderer.drawRect(x + 3, y + 3, 26, 26, 2, true);
  renderer.fillRect(x + cx - 5, y + cy - 5, 10, 10, true);
  renderer.drawLine(x + cx, y + 7, x + cx, y + cy - 6, 2, true);
  renderer.drawLine(x + cx, y + cy + 6, x + cx, y + 25, 2, true);
  renderer.drawLine(x + 7, y + cy, x + cx - 6, y + cy, 2, true);
  renderer.drawLine(x + cx + 6, y + cy, x + 25, y + cy, 2, true);
  renderer.drawLine(x + 9, y + 9, x + 11, y + 11, 2, true);
  renderer.drawLine(x + 21, y + 21, x + 23, y + 23, 2, true);
  renderer.drawLine(x + 21, y + 11, x + 23, y + 9, 2, true);
  renderer.drawLine(x + 9, y + 23, x + 11, y + 21, 2, true);
}
'''
          text = text.replace(marker, helpers + marker, 1)

          old_branch = '''    if (rowIcon != nullptr) {\n      UIIcon icon = rowIcon(i);\n      if (icon == UIIcon::BookmarkIcon) {'''
          new_branch = '''    if (rowIcon != nullptr) {\n      UIIcon icon = rowIcon(i);\n      if (icon == UIIcon::NoteIcon) {\n        drawNoteMainMenuIcon(renderer, textX, textY + 3);\n        textX += mainMenuIconSize + hPaddingInSelection + 2;\n      } else if (icon == UIIcon::MinesweeperIcon) {\n        drawMinesweeperMainMenuIcon(renderer, textX, textY + 3);\n        textX += mainMenuIconSize + hPaddingInSelection + 2;\n      } else if (icon == UIIcon::BookmarkIcon) {'''
          if text.count(old_branch) != 1:
              raise SystemExit(f'Lyra home icon branch mismatch: {text.count(old_branch)}')
          text = text.replace(old_branch, new_branch, 1)
          path.write_text(text)

          # 4) Give Continue/New Game the same rounded-outline language as Reset scores.
          path = Path('src/activities/home/MinesweeperActivity.cpp')
          text = path.read_text()
          marker = '''  const Rect scorePanel = scoreTableRect(renderer, mappedInput);'''
          if text.count(marker) != 1:
              raise SystemExit(f'Minesweeper score panel marker mismatch: {text.count(marker)}')
          button_code = r'''
  // Make the two game actions read as buttons, aligned with the score reset button.
  const auto& menuMetrics = UITheme::getInstance().getMetrics();
  constexpr int actionInsetY = 4;
  const int actionX = menuMetrics.contentSidePadding;
  const int actionWidth = renderer.getScreenWidth() - 2 * menuMetrics.contentSidePadding;
  for (int visible = 0; visible < drawnRows; ++visible) {
    const int itemIndex = topIndex_ + visible;
    if (itemIndex != 5 && itemIndex != 6) continue;
    const int rowTop = listBounds.y + listBounds.height * visible / drawnRows;
    const int rowBottom = listBounds.y + listBounds.height * (visible + 1) / drawnRows;
    const int actionY = rowTop + actionInsetY;
    const int actionHeight = std::max(1, rowBottom - rowTop - 2 * actionInsetY);
    renderer.drawRoundedRect(actionX, actionY, actionWidth, actionHeight, 1, 6, true);
  }

'''
          text = text.replace(marker, button_code + marker, 1)
          path.write_text(text)
          PY

      - name: Commit source changes and remove updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/minesweeper-icons-buttons-once.yml
          git add src/components/themes/BaseTheme.h \
                  src/activities/home/HomeActivity.cpp \
                  src/components/themes/lyra/LyraTheme.cpp \
                  src/activities/home/MinesweeperActivity.cpp
          git commit -m "feat: add app icons and style minesweeper actions"
          git push origin HEAD:x4-pro-notes

# trigger: second push so this workflow exists before the event
