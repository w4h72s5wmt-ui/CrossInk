name: Apply UI fixes once

on:
  push:
    branches:
      - x4-pro-notes
    paths:
      - .github/workflows/apply-ui-fixes-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: x4-pro-notes
      - name: Apply changes
        run: |
          echo '' | base64 -d > /tmp/apply_ui.py
          python3 /tmp/apply_ui.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-ui-fixes-once.yml
          git rm -f .github/workflows/minesweeper-icons-buttons-once.yml
          git add src/components/themes/BaseTheme.h src/activities/home/HomeActivity.cpp src/components/themes/lyra/LyraTheme.cpp src/activities/home/MinesweeperActivity.cpp
          git commit -m 'feat: add app icons and style minesweeper actions'
          git push origin HEAD:x4-pro-notes

# trigger
