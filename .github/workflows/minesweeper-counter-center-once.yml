name: One-shot Minesweeper counter centering

on:
  push:
    branches: [x4-pro-notes]
    paths:
      - .github/workflows/minesweeper-counter-center-once.yml

permissions:
  contents: write

jobs:
  update-counter-centering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: x4-pro-notes

      - name: Center counter text using glyph height
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/activities/home/MinesweeperActivity.cpp')
          text = path.read_text()
          old = '''    const int textHeight = renderer.getLineHeight(counterFont);
              const int textX = panel.x + (panel.width - textWidth) / 2;
              const int textY = panel.y + (panel.height - textHeight) / 2 + 2;'''
          new = '''    const int textHeight = renderer.getTextHeight(counterFont);
              const int textX = panel.x + (panel.width - textWidth) / 2;
              const int textY = panel.y + (panel.height - textHeight) / 2;'''
          if old not in text:
              raise SystemExit('Expected counter-centering block not found; refusing to modify another version.')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one counter-centering block, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source change and remove updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/minesweeper-counter-center-once.yml
          git add src/activities/home/MinesweeperActivity.cpp
          git commit -m "fix: vertically center minesweeper counters"
          git push origin HEAD:x4-pro-notes
