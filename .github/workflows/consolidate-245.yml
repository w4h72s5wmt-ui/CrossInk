name: X4 Pro 245 Direct Source Verification

on:
  push:
    branches:
      - consolidate-245
    paths:
      - .github/workflows/consolidate-245.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-direct-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidated sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-245-pio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Validate RSS tests directly from source
        run: sh tests/rss/run.sh

      - name: Build X4 Pro directly from consolidated source
        run: |
          set -euo pipefail
          pio run -e x4-pro -t clean
          pio run -e x4-pro | tee pio-x4-pro-245.log

      - name: Upload verification firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-consolidated-245
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-consolidated-245-log
          path: pio-x4-pro-245.log
          if-no-files-found: ignore
