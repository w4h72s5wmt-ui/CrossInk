name: RSS X4 Pro Build

on:
  push:
    branches:
      - feat/rss-news-reader
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build X4 Pro
        run: pio run -e x4-pro
