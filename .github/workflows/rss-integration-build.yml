name: RSS X4 Pro Build

on:
  push:
    branches:
      - feat/rss-news-reader
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build X4 Pro
        run: pio run -e x4-pro

      - name: Publish X4 Pro firmware
        uses: actions/upload-artifact@v4
        with:
          name: CrossInk-X4-Pro-RSS
          path: .pio/build/x4-pro/firmware.bin
          if-no-files-found: error
          retention-days: 14
