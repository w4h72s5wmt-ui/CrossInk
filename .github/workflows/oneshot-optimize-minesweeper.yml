name: One-shot Minesweeper consolidation

on:
  push:
    branches:
      - x4-pro-notes
    paths:
      - .github/workflows/oneshot-optimize-minesweeper.yml

permissions:
  contents: write

jobs:
  patch-minesweeper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout x4-pro-notes
        uses: actions/checkout@v4
        with:
          ref: x4-pro-notes
          fetch-depth: 0

      - name: Apply flood-fill and disabled-render optimizations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/activities/home/MinesweeperActivity.cpp')
          text = path.read_text()

          flood_pattern = re.compile(
              r"void MinesweeperActivity::revealFlood\(const int startIndex\) \{.*?\n\}\n\nvoid MinesweeperActivity::toggleFlag",
              re.S,
          )
          flood_replacement = '''void MinesweeperActivity::revealFlood(const int startIndex) {
            std::array<uint8_t, kMaxCells> queue{};
            CellBits queued{};
            const int dimension = gridDimension();
            const int cellCount = dimension * dimension;
            int head = 0;
            int tail = 0;
            queue[tail++] = static_cast<uint8_t>(startIndex);
            queued[startIndex] = 1;

            while (head < tail) {
              const int index = queue[head++];
              if (index < 0 || index >= cellCount || revealed_[index] || flagged_[index] || mines_[index]) continue;
              revealed_[index] = 1;
              ++revealedSafeCells_;
              if (adjacentMineCount(index) != 0) continue;

              const int row = index / dimension;
              const int col = index % dimension;
              for (int dr = -1; dr <= 1; ++dr) {
                for (int dc = -1; dc <= 1; ++dc) {
                  if (dr == 0 && dc == 0) continue;
                  const int nr = row + dr;
                  const int nc = col + dc;
                  if (nr < 0 || nr >= dimension || nc < 0 || nc >= dimension) continue;
                  const int next = nr * dimension + nc;
                  if (!revealed_[next] && !queued[next] && !flagged_[next] && !mines_[next] && tail < kMaxCells) {
                    queued[next] = 1;
                    queue[tail++] = static_cast<uint8_t>(next);
                  }
                }
              }
            }
          }

          void MinesweeperActivity::toggleFlag'''

          text, flood_count = flood_pattern.subn(flood_replacement, text, count=1)
          if flood_count != 1:
              raise SystemExit(f'revealFlood replacement count={flood_count}')

          render_pattern = re.compile(
              r"(?P<indent>\s*)for \(int y = actionY; y < actionY \+ actionHeight; \+\+y\) \{\n"
              r"(?P=indent)  for \(int x = actionX; x < actionX \+ actionWidth; \+\+x\) \{\n"
              r"(?P=indent)    if \(\(\(x \+ y\) & 1\) == 0\) renderer\.fillRect\(x, y, 1, 1, false\);\n"
              r"(?P=indent)  \}\n"
              r"(?P=indent)\}",
              re.S,
          )

          def repl(match):
              i = match.group('indent')
              return (
                  f"{i}// One horizontal erase span every other row gives the same\n"
                  f"{i}// disabled/dithered impression with O(height) draw calls instead of\n"
                  f"{i}// O(width * height) single-pixel calls.\n"
                  f"{i}for (int y = actionY; y < actionY + actionHeight; y += 2) {{\n"
                  f"{i}  renderer.fillRect(actionX, y, actionWidth, 1, false);\n"
                  f"{i}}}"
              )

          text, render_count = render_pattern.subn(repl, text, count=1)
          if render_count != 1:
              raise SystemExit(f'disabled Continue replacement count={render_count}')

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/activities/home/MinesweeperActivity.cpp

      - name: Commit optimized Minesweeper
        shell: bash
        run: |
          git config user.name "w4h72s5wmt-ui"
          git config user.email "w4h72s5wmt@privaterelay.appleid.com"
          git add src/activities/home/MinesweeperActivity.cpp
          git commit -m "fix: consolidate Minesweeper flood fill and render"
          git push origin HEAD:x4-pro-notes
