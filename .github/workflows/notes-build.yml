name: CrossInk X4 Pro optimization candidate

on:
  push:
    branches: [x4-pro-opt-bootstrap]

permissions:
  contents: write

jobs:
  build-x4-pro-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 3

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-notes-pio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Apply native exit and RSS optimization candidate
        run: |
          python3 tools/x4_opt_candidate.py
          git diff --check
          git diff --stat

      - name: Freeze clean source tree
        run: |
          git fetch --depth=1 origin 3d896fb4377f58516a893c302b2e89bdbaaf28af
          git checkout 3d896fb4377f58516a893c302b2e89bdbaaf28af -- .github/workflows/notes-build.yml
          git rm tools/x4_opt_candidate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests/rss/test_article_cache.cpp .github/workflows/notes-build.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf(x4): optimize RSS memory and native app exit"
          git push --force origin HEAD:x4-pro-opt-generated

      - name: Test RSS cache with ASan and UBSan
        run: sh tests/rss/run.sh

      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro optimized firmware
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro-notes.log

      - name: Upload X4 Pro candidate firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-optimization-candidate-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-optimization-candidate-${{ github.run_number }}-log
          path: pio-x4-pro-notes.log
          if-no-files-found: ignore
