          finish_game = '''void MinesweeperActivity::finishGame(const bool won) {
  gameOver_ = true;
  won_ = won;

  if (won) {
    undoAvailable = false;
    undoMineIndex = -1;
    lossUndoDeadlineUs = 0;
    for (int i = 0; i < totalCells(); ++i) {
      revealed_[i] = 1;
      if (mines_[i]) flagged_[i] = 1;
    }
  } else {
    lossUndoDeadlineUs = 0;
  }

  flushBestScores();
  clearSavedGame();
  viewMode_ = ViewMode::Result;
  requestUpdate();
}

