name: CrossInk Missile Command consolidation

on:
  push:
    branches: [x4-pro-missile-command]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Integrate validated Missile Command source
        run: python tools/integrate_missile_command.py

      - name: Commit direct integration and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/integrate_missile_command.py
          git add src/activities/home/HomeActivity.cpp src/activities/home/HomeActivity.h
          git commit -m "feat(missile): integrate Missile Command into Home"
          git push origin HEAD:x4-pro-missile-command
