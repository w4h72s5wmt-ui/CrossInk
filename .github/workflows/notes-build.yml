          tests.write_text(text.replace(old, new, 1))

          # Static regression assertions for the navigation/foundation cleanup.
          checks = {
              "Minesweeper Home exit": "onGoHome();" in Path("src/activities/home/MinesweeperActivity.cpp").read_text(),
              "2048 Home exit": "onGoHome();" in Path("src/activities/home/Game2048Activity.cpp").read_text(),
              "Notes Home exit": Path("src/activities/home/NotesActivityCore.inc").read_text().count("onGoHome();") >= 2,
              "RSS Home exit": Path("src/activities/home/RssNewsActivity.cpp").read_text().count("onGoHome();") >= 2,
              "RSS bridge removed": "RSS_NEWS" not in Path("src/activities/ActivityManager.h").read_text(),
              "RSS special restart removed": "silentRestartAfterNetworkToRssMenu" not in Path("src/main.cpp").read_text(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("candidate validation failed: " + ", ".join(failed))
          PY

          git diff --check
          git diff --stat

      - name: Test RSS cache with ASan and UBSan
        run: sh tests/rss/run.sh

      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro optimized firmware
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro-notes.log

      - name: Freeze validated source tree
        run: |
          git checkout 3d896fb4377f58516a893c302b2e89bdbaaf28af -- .github/workflows/notes-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests/rss/test_article_cache.cpp .github/workflows/notes-build.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf(x4): optimize RSS memory and native app exit"
          git push --force origin HEAD:x4-pro-opt-generated

      - name: Upload X4 Pro candidate firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-optimization-candidate-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-optimization-candidate-${{ github.run_number }}-log
          path: pio-x4-pro-notes.log
          if-no-files-found: ignore
