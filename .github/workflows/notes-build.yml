name: CrossInk X4 Pro RSS metadata freeze

on:
  push:
    branches: [x4-pro-rss-metadata-opt]

permissions:
  contents: write

jobs:
  freeze-x4-pro-rss-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Apply validated RSS metadata candidate
        run: |
          python3 tools/fix_x4_rss_metadata_generator.py
          python3 tools/x4_rss_metadata_opt_candidate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/rss/test_fetch_diagnostics.cpp")
          text = p.read_text()
          old = '  check(!Storage.exists(RC::bodyPath(item).c_str()), "capacity failure still leaves no body");\n'
          new = '  check(RC::hasReadableBody(item) && !RC::hasCurrentBody(item), "capacity failure persists retriable fallback");\n'
          if text.count(old) != 1:
              raise SystemExit("diagnostic fallback expectation anchor mismatch")
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Test validated RSS tree
        run: sh tests/rss/run.sh

      - name: Freeze clean source tree
        run: |
          git fetch origin x4-pro-notes --depth=1
          git checkout FETCH_HEAD -- .github/workflows/notes-build.yml
          git rm -f tools/x4_rss_metadata_opt_candidate.py tools/fix_x4_rss_metadata_generator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests/rss .github/workflows/notes-build.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf(rss): shrink historical metadata memory"
          git push --force origin HEAD:x4-pro-rss-metadata-generated
