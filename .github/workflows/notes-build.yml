          cache_h = Path("src/activities/home/RssArticleCache.h")
          text = cache_h.read_text()
          old = '''std::string bodyPath(const RssItem& item);

          // Removes the dedicated offline body for an article. Missing files count as
          '''
          new = '''std::string bodyPath(const RssItem& item);

          // True only when the dedicated body exists and matches the current cache
