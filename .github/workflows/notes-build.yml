          reveal_cell = '''void MinesweeperActivity::revealCell(const int index) {
  if (gameOver_ || index < 0 || index >= totalCells() || flagged_[index] || revealed_[index]) return;

  if (!minesPlaced_) placeMines(index);
  if (mines_[index]) {
    undoAvailable = true;
    undoMineIndex = index;
    revealed_[index] = 1;
    finishGame(false);
    return;
  }
  revealFlood(index);
  if (!scoreFrozen) {
    officialScore = revealedSafeCells_;
    updateBestScore(gridSizeIndex_, officialScore);
  }
  checkWin();
}

'''
