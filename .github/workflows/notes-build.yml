name: CrossInk direct source update

on:
  push:
    branches: [x4-pro-notes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update real source files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          # Keyboard: on e-ink, do not redraw merely to show transient touch-down/touch-up state.
          replace_one(
              "src/activities/util/KeyboardEntryActivity.cpp",
              """    if (result.activeChanged) {\n      requestUpdate();\n    }\n""",
              """    // A transient touch highlight is not worth a full e-ink refresh. The\n    // actual key event below performs the single useful redraw after the text changes.\n    // This removes the extra refresh that previously happened on touch-down/release.\n""",
          )

          # Predictive cache state.
          replace_one(
              "src/activities/util/PredictiveText.h",
              """  std::vector<PersonalWord> personal_;\n  bool dirty_ = false;\n\n""",
              """  std::vector<PersonalWord> personal_;\n  bool dirty_ = false;\n  uint32_t revision_ = 1;\n  mutable uint32_t cachedRevision_ = 0;\n  mutable std::string cachedKey_;\n  mutable std::array<std::string, 3> cachedSuggestions_{};\n\n""",
          )
          replace_one(
              "src/activities/util/PredictiveText.h",
              """  void addPersonalWord(const std::string& word, uint16_t increment, bool allowBuiltin);\n""",
              """  void addPersonalWord(const std::string& word, uint16_t increment, bool allowBuiltin);\n  void invalidateSuggestionCache();\n""",
          )

          # Cheap first-letter folding avoids allocating/folding hundreds of irrelevant words per keystroke.
          replace_one(
              "src/activities/util/PredictiveText.cpp",
              """bool asciiUpper(const unsigned char c) { return c >= 'A' && c <= 'Z'; }\n\n}  // namespace\n\n""",
              """bool asciiUpper(const unsigned char c) { return c >= 'A' && c <= 'Z'; }\n\nchar foldedInitial(const char* word) {\n  if (!word || !*word) return '\\0';\n  const unsigned char c = static_cast<unsigned char>(word[0]);\n  if (c < 0x80) {\n    char ch = static_cast<char>(c);\n    if (ch >= 'A' && ch <= 'Z') ch = static_cast<char>(ch - 'A' + 'a');\n    return ch;\n  }\n  if (c == 0xC3 && word[1]) {\n    switch (static_cast<unsigned char>(word[1])) {\n      case 0x80: case 0x81: case 0x82: case 0x83: case 0x84: case 0x85:\n      case 0xA0: case 0xA1: case 0xA2: case 0xA3: case 0xA4: case 0xA5: return 'a';\n      case 0x87: case 0xA7: return 'c';\n      case 0x88: case 0x89: case 0x8A: case 0x8B:\n      case 0xA8: case 0xA9: case 0xAA: case 0xAB: return 'e';\n      case 0x8C: case 0x8D: case 0x8E: case 0x8F:\n      case 0xAC: case 0xAD: case 0xAE: case 0xAF: return 'i';\n      case 0x92: case 0x93: case 0x94: case 0x95: case 0x96:\n      case 0xB2: case 0xB3: case 0xB4: case 0xB5: case 0xB6: return 'o';\n      case 0x99: case 0x9A: case 0x9B: case 0x9C:\n      case 0xB9: case 0xBA: case 0xBB: case 0xBC: return 'u';\n      case 0x9D: case 0xBD: case 0xBF: return 'y';\n      default: break;\n    }\n  }\n  return '\\0';\n}\n\n}  // namespace\n\nvoid PredictiveText::invalidateSuggestionCache() {\n  ++revision_;\n  if (revision_ == 0) revision_ = 1;\n  cachedRevision_ = 0;\n  cachedKey_.clear();\n  cachedSuggestions_ = {};\n}\n\n""",
          )

          replace_one(
              "src/activities/util/PredictiveText.cpp",
              """        item.count = static_cast<uint16_t>(std::min<uint32_t>(next, 65535));\n        dirty_ = true;\n""",
              """        item.count = static_cast<uint16_t>(std::min<uint32_t>(next, 65535));\n        dirty_ = true;\n        invalidateSuggestionCache();\n""",
          )
          replace_one(
              "src/activities/util/PredictiveText.cpp",
              """  personal_.push_back(PersonalWord{normalized, static_cast<uint16_t>(std::max<uint16_t>(1, increment))});\n  dirty_ = true;\n""",
              """  personal_.push_back(PersonalWord{normalized, static_cast<uint16_t>(std::max<uint16_t>(1, increment))});\n  dirty_ = true;\n  invalidateSuggestionCache();\n""",
          )
          replace_one(
              "src/activities/util/PredictiveText.cpp",
              """void PredictiveText::load() {\n  personal_.clear();\n  dirty_ = false;\n""",
              """void PredictiveText::load() {\n  personal_.clear();\n  dirty_ = false;\n  invalidateSuggestionCache();\n""",
          )

          old_suggestions = r'''std::array<std::string, 3> PredictiveText::suggestions(const std::string& text, const size_t cursorPos) const {
  std::array<std::string, 3> result{};
  size_t start = 0;
  size_t end = 0;
  currentWordRange(text, cursorPos, start, end);
  if (cursorPos <= start) return result;

  const std::string typed = normalizeWord(text.substr(start, cursorPos - start));
  const std::string foldedPrefix = foldForMatch(typed);
  if (foldedPrefix.size() < 2) return result;

  std::vector<const PersonalWord*> matches;
  matches.reserve(personal_.size());
  for (const auto& item : personal_) {
    if (startsWithFolded(item.word, foldedPrefix) && foldForMatch(item.word) != foldedPrefix) matches.push_back(&item);
  }
  std::sort(matches.begin(), matches.end(), [](const PersonalWord* a, const PersonalWord* b) {
    if (a->count != b->count) return a->count > b->count;
    return a->word < b->word;
  });

  size_t slot = 0;
  auto add = [&](std::string candidate) {
    if (slot >= result.size()) return;
    const std::string foldedCandidate = foldForMatch(candidate);
    for (size_t i = 0; i < slot; ++i) {
      if (foldForMatch(result[i]) == foldedCandidate) return;
    }
    if (!typed.empty() && asciiUpper(static_cast<unsigned char>(text[start])) && !candidate.empty() &&
        candidate[0] >= 'a' && candidate[0] <= 'z') {
      candidate[0] = static_cast<char>(candidate[0] - 'a' + 'A');
    }
    result[slot++] = std::move(candidate);
  };

  for (const PersonalWord* item : matches) {
    add(item->word);
    if (slot >= result.size()) break;
  }
  for (size_t i = 0; i < kFrenchWordCount && slot < result.size(); ++i) {
    const std::string word = kFrenchWords[i];
    if (startsWithFolded(word, foldedPrefix) && foldForMatch(word) != foldedPrefix) add(word);
  }
  return result;
}
'''
          new_suggestions = r'''std::array<std::string, 3> PredictiveText::suggestions(const std::string& text, const size_t cursorPos) const {
  std::array<std::string, 3> result{};
  size_t start = 0;
  size_t end = 0;
  currentWordRange(text, cursorPos, start, end);
  if (cursorPos <= start) return result;

  const std::string typed = normalizeWord(text.substr(start, cursorPos - start));
  const std::string foldedPrefix = foldForMatch(typed);
  if (foldedPrefix.size() < 2) return result;

  std::string cacheKey = foldedPrefix;
  cacheKey.push_back(!typed.empty() && asciiUpper(static_cast<unsigned char>(text[start])) ? 'U' : 'L');
  if (cachedRevision_ == revision_ && cachedKey_ == cacheKey) return cachedSuggestions_;

  std::vector<const PersonalWord*> matches;
  matches.reserve(personal_.size());
  for (const auto& item : personal_) {
    if (foldedInitial(item.word.c_str()) != foldedPrefix[0]) continue;
    const std::string foldedWord = foldForMatch(item.word);
    if (foldedWord.size() >= foldedPrefix.size() &&
        foldedWord.compare(0, foldedPrefix.size(), foldedPrefix) == 0 && foldedWord != foldedPrefix) {
      matches.push_back(&item);
    }
  }
  std::sort(matches.begin(), matches.end(), [](const PersonalWord* a, const PersonalWord* b) {
    if (a->count != b->count) return a->count > b->count;
    return a->word < b->word;
  });

  size_t slot = 0;
  auto add = [&](std::string candidate) {
    if (slot >= result.size()) return;
    const std::string foldedCandidate = foldForMatch(candidate);
    for (size_t i = 0; i < slot; ++i) {
      if (foldForMatch(result[i]) == foldedCandidate) return;
    }
    if (!typed.empty() && asciiUpper(static_cast<unsigned char>(text[start])) && !candidate.empty() &&
        candidate[0] >= 'a' && candidate[0] <= 'z') {
      candidate[0] = static_cast<char>(candidate[0] - 'a' + 'A');
    }
    result[slot++] = std::move(candidate);
  };

  for (const PersonalWord* item : matches) {
    add(item->word);
    if (slot >= result.size()) break;
  }
  for (size_t i = 0; i < kFrenchWordCount && slot < result.size(); ++i) {
    if (foldedInitial(kFrenchWords[i]) != foldedPrefix[0]) continue;
    const std::string word = kFrenchWords[i];
    const std::string foldedWord = foldForMatch(word);
    if (foldedWord.size() >= foldedPrefix.size() &&
        foldedWord.compare(0, foldedPrefix.size(), foldedPrefix) == 0 && foldedWord != foldedPrefix) {
      add(word);
    }
  }

  cachedKey_ = std::move(cacheKey);
  cachedSuggestions_ = result;
  cachedRevision_ = revision_;
  return cachedSuggestions_;
}
'''
          replace_one("src/activities/util/PredictiveText.cpp", old_suggestions, new_suggestions)

          # Minesweeper score area: keep the table, remove the SCORES title row, add reset button below it.
          replace_one(
              "src/activities/home/MinesweeperActivity.cpp",
              """constexpr int BEST_SCORE_PANEL_HEIGHT = 184;\nconstexpr int SCORE_GRID_COUNT = 4;\n""",
              """constexpr int SCORE_TABLE_HEIGHT = 152;\nconstexpr int SCORE_RESET_GAP = 8;\nconstexpr int SCORE_RESET_BUTTON_HEIGHT = 44;\nconstexpr int SCORE_AREA_HEIGHT = SCORE_TABLE_HEIGHT + SCORE_RESET_GAP + SCORE_RESET_BUTTON_HEIGHT;\nconstexpr int SCORE_GRID_COUNT = 4;\n""",
          )
          replace_one(
              "src/activities/home/MinesweeperActivity.cpp",
              """              renderer.getScreenHeight() - contentTop - metrics.buttonHintsHeight - metrics.verticalSpacing -\n                  BEST_SCORE_PANEL_HEIGHT};\n}\n\nRect headerRect""",
              """              renderer.getScreenHeight() - contentTop - metrics.buttonHintsHeight - metrics.verticalSpacing -\n                  SCORE_AREA_HEIGHT};\n}\n\nRect scoreTableRect(const GfxRenderer& renderer, const MappedInputManager& mappedInput) {\n  const auto& metrics = UITheme::getInstance().getMetrics();\n  const Rect list = menuListRect(renderer, mappedInput);\n  return Rect{metrics.contentSidePadding, list.y + list.height,\n              renderer.getScreenWidth() - 2 * metrics.contentSidePadding, SCORE_TABLE_HEIGHT};\n}\n\nRect scoreResetButtonRect(const GfxRenderer& renderer, const MappedInputManager& mappedInput) {\n  const Rect table = scoreTableRect(renderer, mappedInput);\n  return Rect{table.x, table.y + table.height + SCORE_RESET_GAP, table.width, SCORE_RESET_BUTTON_HEIGHT};\n}\n\nRect headerRect""",
          )

          loop_anchor = r'''  if ((mappedInput.hasTouchHardware() && TouchHeaderBackButton::wasTapped(mappedInput, header)) ||
      mappedInput.wasPressed(MappedInputManager::Button::Back)) {
    mappedInput.suppressNextBackRelease();
    finish();
    return;
  }

  if (uiReady_) {
'''
          loop_new = r'''  if ((mappedInput.hasTouchHardware() && TouchHeaderBackButton::wasTapped(mappedInput, header)) ||
      mappedInput.wasPressed(MappedInputManager::Button::Back)) {
    mappedInput.suppressNextBackRelease();
    finish();
    return;
  }

  int resetTapX = 0;
  int resetTapY = 0;
  if (mappedInput.hasTouchHardware() && mappedInput.wasScreenTapped(resetTapX, resetTapY) &&
      pointInRect(scoreResetButtonRect(renderer, mappedInput), resetTapX, resetTapY)) {
    startActivityForResult(
        std::make_unique<ConfirmationActivity>(renderer, mappedInput, "Reinitialiser les scores",
                                               "Effacer tous les meilleurs scores ?"),
        [this](const ActivityResult& result) {
          if (!result.isCancelled) {
            bestScores.fill(0);
            if (Storage.exists(SCORE_PATH)) Storage.remove(SCORE_PATH);
          }
          requestUpdate();
        });
    return;
  }

  if (uiReady_) {
'''
          replace_one("src/activities/home/MinesweeperActivity.cpp", loop_anchor, loop_new)

          old_score_render = r'''  const auto& metrics = UITheme::getInstance().getMetrics();
  const Rect listBounds = menuListRect(renderer, mappedInput);
  const Rect scorePanel{metrics.contentSidePadding, listBounds.y + listBounds.height,
                        renderer.getScreenWidth() - 2 * metrics.contentSidePadding, BEST_SCORE_PANEL_HEIGHT};
  renderer.fillRect(scorePanel.x, scorePanel.y, scorePanel.width, scorePanel.height, false);
  renderer.drawRect(scorePanel.x, scorePanel.y, scorePanel.width, scorePanel.height, 1, true);
  const int titleRowHeight = 32;
  const int headerRowHeight = 28;
  const int dataTop = scorePanel.y + titleRowHeight + headerRowHeight;
  const int dataHeight = scorePanel.height - titleRowHeight - headerRowHeight;
  const int splitX = scorePanel.x + scorePanel.width * 2 / 5;

  renderer.drawLine(scorePanel.x, scorePanel.y + titleRowHeight, scorePanel.x + scorePanel.width,
                    scorePanel.y + titleRowHeight, 1, true);
  renderer.drawLine(scorePanel.x, dataTop, scorePanel.x + scorePanel.width, dataTop, 1, true);
  renderer.drawLine(splitX, scorePanel.y + titleRowHeight, splitX, scorePanel.y + scorePanel.height, 1, true);

  auto drawCenteredCellText = [this](const int fontId, const Rect& cell, const char* text) {
    const int textWidth = renderer.getTextWidth(fontId, text);
    const int textHeight = renderer.getLineHeight(fontId);
    renderer.drawText(fontId, cell.x + std::max(0, (cell.width - textWidth) / 2),
                      cell.y + std::max(0, (cell.height - textHeight) / 2) + 1, text);
  };

  const Rect titleCell{scorePanel.x, scorePanel.y, scorePanel.width, titleRowHeight};
  drawCenteredCellText(UI_12_FONT_ID, titleCell, "SCORES");
  const Rect gridHeader{scorePanel.x, scorePanel.y + titleRowHeight, splitX - scorePanel.x, headerRowHeight};
  const Rect bestHeader{splitX, scorePanel.y + titleRowHeight, scorePanel.x + scorePanel.width - splitX,
                        headerRowHeight};
  drawCenteredCellText(UI_10_FONT_ID, gridHeader, "GRILLE");
  drawCenteredCellText(UI_10_FONT_ID, bestHeader, "MEILLEUR SCORE");

  constexpr const char* SCORE_GRID_LABELS[SCORE_GRID_COUNT] = {"5 x 5", "9 x 9", "12 x 12", "16 x 16"};
  for (int row = 0; row < SCORE_GRID_COUNT; ++row) {
    const int rowY = dataTop + dataHeight * row / SCORE_GRID_COUNT;
    const int nextRowY = dataTop + dataHeight * (row + 1) / SCORE_GRID_COUNT;
    const int rowHeight = nextRowY - rowY;
    if (row > 0) renderer.drawLine(scorePanel.x, rowY, scorePanel.x + scorePanel.width, rowY, 1, true);

    const Rect gridCell{scorePanel.x, rowY, splitX - scorePanel.x, rowHeight};
    const Rect bestCell{splitX, rowY, scorePanel.x + scorePanel.width - splitX, rowHeight};
    char scoreValue[16];
    std::snprintf(scoreValue, sizeof(scoreValue), "%03u", static_cast<unsigned>(bestScores[row]));
    drawCenteredCellText(UI_10_FONT_ID, gridCell, SCORE_GRID_LABELS[row]);
    drawCenteredCellText(UI_10_FONT_ID, bestCell, scoreValue);
  }
'''
          new_score_render = r'''  const Rect scorePanel = scoreTableRect(renderer, mappedInput);
  renderer.fillRect(scorePanel.x, scorePanel.y, scorePanel.width, scorePanel.height, false);
  renderer.drawRect(scorePanel.x, scorePanel.y, scorePanel.width, scorePanel.height, 1, true);
  const int headerRowHeight = 28;
  const int dataTop = scorePanel.y + headerRowHeight;
  const int dataHeight = scorePanel.height - headerRowHeight;
  const int splitX = scorePanel.x + scorePanel.width * 2 / 5;

  renderer.drawLine(scorePanel.x, dataTop, scorePanel.x + scorePanel.width, dataTop, 1, true);
  renderer.drawLine(splitX, scorePanel.y, splitX, scorePanel.y + scorePanel.height, 1, true);

  auto drawCenteredCellText = [this](const int fontId, const Rect& cell, const char* text) {
    const int textWidth = renderer.getTextWidth(fontId, text);
    const int textHeight = renderer.getLineHeight(fontId);
