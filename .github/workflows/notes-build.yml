name: Materialize validated RSS spacing fix

on:
  push:
    branches: [x4-pro-rss-spacing-rootfix-validation]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply validated candidate
        run: |
          python tools/x4_rss_spacing_rootfix.py
          python tools/x4_rss_spacing_rootfix_adjust.py

      - name: Materialize clean commit
        run: |
          set -euo pipefail
          mkdir -p /tmp/rss-spacing-fix/src/activities/home /tmp/rss-spacing-fix/tests/rss
          cp src/activities/home/RssArticleHtml.inc /tmp/rss-spacing-fix/src/activities/home/
          cp src/activities/home/RssArticleRichText.h /tmp/rss-spacing-fix/src/activities/home/
          cp src/activities/home/RssArticleCache.cpp /tmp/rss-spacing-fix/src/activities/home/
          cp tests/rss/test_article_cache.cpp /tmp/rss-spacing-fix/tests/rss/

          git reset --hard 540404358344d77767c268e9858ff6401370201d
          cp /tmp/rss-spacing-fix/src/activities/home/RssArticleHtml.inc src/activities/home/
          cp /tmp/rss-spacing-fix/src/activities/home/RssArticleRichText.h src/activities/home/
          cp /tmp/rss-spacing-fix/src/activities/home/RssArticleCache.cpp src/activities/home/
          cp /tmp/rss-spacing-fix/tests/rss/test_article_cache.cpp tests/rss/

          git config user.name "CrossInk Builder"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B x4-pro-rss-spacing-rootfix-generated
          git add src/activities/home/RssArticleHtml.inc src/activities/home/RssArticleRichText.h src/activities/home/RssArticleCache.cpp tests/rss/test_article_cache.cpp
          git commit -m "fix(rss): preserve article text spacing"
          git push --force origin x4-pro-rss-spacing-rootfix-generated
