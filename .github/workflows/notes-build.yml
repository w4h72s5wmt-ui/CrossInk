name: CrossInk direct source update

on:
  push:
    branches: [x4-pro-notes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update real source files
        run: python .github/source_update.py

      - name: Commit direct source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/util/KeyboardEntryActivity.cpp src/activities/util/PredictiveText.h src/activities/util/PredictiveText.cpp src/activities/home/MinesweeperActivity.cpp
          git diff --cached --check
          git commit -m "feat: speed up Notes keyboard and reset minesweeper scores"
          git push origin HEAD:x4-pro-notes
