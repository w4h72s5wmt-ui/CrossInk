name: CrossInk direct minesweeper update

on:
  push:
    branches: [x4-pro-notes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update Minesweeper source
        run: python .github/minesweeper_menu_update.py
      - name: Commit source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/home/MinesweeperActivity.cpp
          git diff --cached --check
          git commit -m "feat: polish minesweeper menu selectors and score header"
          git push origin HEAD:x4-pro-notes
