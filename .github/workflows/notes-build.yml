name: CrossInk Notes + Demineur X4 Pro

on:
  push:
    branches: [x4-pro-notes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x4-pro-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply V3 app optimizations
        run: |
          set -euo pipefail
          python3 scripts/app_optimize_v3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/app_optimize_v3.py
          git add .github/workflows/notes-build.yml src/activities/home/MinesweeperActivity.h \
                  src/activities/home/MinesweeperActivity.cpp src/activities/util/PredictiveText.cpp
          git commit -m "perf: pack minesweeper state and stream predictive storage"
          git push origin HEAD:x4-pro-notes

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-notes-pio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Cache incremental X4 Pro build
        uses: actions/cache@v4
        with:
          path: |
            .pio/build/x4-pro
            .pio/libdeps/x4-pro
          key: ${{ runner.os }}-x4-pro-pio6.1.19-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-x4-pro-pio6.1.19-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro firmware directly from sources
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro-notes.log

      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-build-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-build-${{ github.run_number }}-log
          path: pio-x4-pro-notes.log
          if-no-files-found: ignore
