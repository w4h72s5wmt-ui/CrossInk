name: CrossInk RSS structural spacing validation

on:
  push:
    branches: [x4-pro-rss-spacing2]

permissions:
  contents: write

jobs:
  build-x4-pro-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-notes-pio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Materialize clean RSS structural spacing commit
        run: |
          set -euo pipefail
          python tools/x4_rss_spacing2_candidate.py
          rm tools/x4_rss_spacing2_candidate.py
          git checkout e9be909c924d30dd505454956728930caef6448c -- .github/workflows/notes-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/activities/home/RssArticleCache.cpp src/activities/home/RssArticleHtml.inc tests/rss/test_article_cache.cpp .github/workflows/notes-build.yml tools/x4_rss_spacing2_candidate.py
          git commit -m "fix(rss): preserve structural text spacing"
          git push origin HEAD:x4-pro-rss-spacing2

      - name: Test RSS cache with ASan and UBSan
        run: sh tests/rss/run.sh

      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro firmware directly from sources
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro-notes.log

      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-spacing2-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-spacing2-${{ github.run_number }}-log
          path: pio-x4-pro-notes.log
          if-no-files-found: ignore
