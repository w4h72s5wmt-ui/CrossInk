name: CrossInk RSS boundary cleanup validation

on:
  push:
    branches: [x4-pro-rss-boundary-cleanup-validation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x4-pro-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk sources
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Apply RSS boundary candidate
        run: python tools/x4_rss_boundary_cleanup_candidate.py

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-notes-pio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Test RSS cache with ASan and UBSan
        run: sh tests/rss/run.sh

      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro firmware directly from candidate sources
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro-notes.log

      - name: Materialize clean source and repository cleanup commit
        run: |
          set -euo pipefail
          base=1f151c8980c9c263fe68ce340d1222f25fcb47e4
          mkdir -p /tmp/rss-final/src/activities/home /tmp/rss-final/tests/rss
          cp src/activities/home/RssArticleCache.cpp /tmp/rss-final/src/activities/home/
          cp src/activities/home/RssArticleHtml.inc /tmp/rss-final/src/activities/home/
          cp tests/rss/test_article_cache.cpp /tmp/rss-final/tests/rss/
          git reset --hard "$base"
          cp /tmp/rss-final/src/activities/home/RssArticleCache.cpp src/activities/home/
          cp /tmp/rss-final/src/activities/home/RssArticleHtml.inc src/activities/home/
          cp /tmp/rss-final/tests/rss/test_article_cache.cpp tests/rss/
          rm -f .github/workflows/apply-rss-offline-patch.yml .github/workflows/rss-integration-build.yml
          rm -f tools/apply_rss_offline_patch.py tools/run_rss_offline_patch.py tools/apply_x4_*.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B x4-pro-rss-boundary-cleanup-generated
          git add src/activities/home/RssArticleCache.cpp src/activities/home/RssArticleHtml.inc tests/rss/test_article_cache.cpp .github/workflows tools
          git commit -m "fix(rss): preserve structural text boundaries"
          git push --force origin x4-pro-rss-boundary-cleanup-generated

      - name: Upload X4 Pro firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-boundary-cleanup-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-boundary-cleanup-${{ github.run_number }}-log
          path: pio-x4-pro-notes.log
          if-no-files-found: ignore
