name: RSS spacing root fix validation

on:
  push:
    branches: [x4-pro-rss-spacing-rootfix-validation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-crossink-rss-spacing-rootfix-pio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Apply candidate directly to app sources
        run: python tools/x4_rss_spacing_rootfix.py

      - name: Test RSS cache with ASan and UBSan
        run: sh tests/rss/run.sh

      - name: Clean X4 Pro build output
        run: pio run -e x4-pro -t clean

      - name: Build X4 Pro firmware
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro-rss-spacing-rootfix.log

      - name: Upload candidate firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-rss-spacing-rootfix-${{ github.run_number }}
          path: .pio/build/x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

      - name: Materialize clean generated commit
        run: |
          set -euo pipefail
          mkdir -p /tmp/rss-rootfix/src/activities/home /tmp/rss-rootfix/tests/rss
          cp src/activities/home/RssArticleHtml.inc /tmp/rss-rootfix/src/activities/home/
          cp src/activities/home/RssArticleRichText.h /tmp/rss-rootfix/src/activities/home/
          cp src/activities/home/RssArticleCache.cpp /tmp/rss-rootfix/src/activities/home/
          cp tests/rss/test_article_cache.cpp /tmp/rss-rootfix/tests/rss/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --detach 540404358344d77767c268e9858ff6401370201d
          cp /tmp/rss-rootfix/src/activities/home/RssArticleHtml.inc src/activities/home/
          cp /tmp/rss-rootfix/src/activities/home/RssArticleRichText.h src/activities/home/
          cp /tmp/rss-rootfix/src/activities/home/RssArticleCache.cpp src/activities/home/
          cp /tmp/rss-rootfix/tests/rss/test_article_cache.cpp tests/rss/
          git add src/activities/home/RssArticleHtml.inc src/activities/home/RssArticleRichText.h src/activities/home/RssArticleCache.cpp tests/rss/test_article_cache.cpp
          git commit -m "fix(rss): preserve article spacing across structural boundaries"
          git push origin HEAD:refs/heads/x4-pro-rss-spacing-rootfix-generated --force

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x4-pro-rss-spacing-rootfix-${{ github.run_number }}-log
          path: pio-x4-pro-rss-spacing-rootfix.log
          if-no-files-found: ignore
